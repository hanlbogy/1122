<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로 드림 강점 분석 (초등용)</title>
    <!-- 예쁜 한글 폰트 추가 (주아체, 고운돋움) -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #9b59b6;
            --secondary-color: #8e44ad;
            --accent-color: #ff7eb3;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
 
        .container {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(142, 68, 173, 0.2);
            position: relative;
            overflow: hidden;
            border: 4px solid #fff;
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }
 
        /* 화면 전환 효과 */
        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
 
        .screen.active {
            display: flex;
            opacity: 1;
            animation: slideUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
 
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
 
        h1 {
            font-family: 'Jua', sans-serif;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 15px;
            font-size: 2.5em;
            text-shadow: 2px 2px 0px #f3e5f5;
        }
 
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
            line-height: 1.6;
        }
 
        .input-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 10px; 
            color: var(--secondary-color); 
            font-family: 'Jua', sans-serif; 
            font-size: 1.2em;
        }
        
        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1bee7;
            border-radius: 15px;
            font-size: 16px;
            background: #fbf6fd;
            transition: all 0.3s;
            font-family: 'Gowun Dodum', sans-serif;
        }
 
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.1);
            background: #fff;
        }
 
        .btn {
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            color: white;
            padding: 20px;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: auto; /* 하단 배치 */
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3);
        }
        
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 15px 25px rgba(255, 117, 140, 0.4);
        }
 
        .btn:active {
            transform: scale(0.98);
        }
 
        /* 퀴즈 화면 스타일 */
        .progress-container {
            width: 100%;
            height: 15px;
            background-color: #f0f0f0;
            border-radius: 20px;
            margin-bottom: 30px;
            overflow: hidden;
        }
 
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a18cd1, #fbc2eb);
            width: 0%;
            transition: width 0.5s ease-in-out;
            border-radius: 20px;
        }
 
        .question-number {
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
 
        .question-text {
            font-family: 'Jua', sans-serif;
            font-size: 1.6em;
            text-align: center;
            color: #4a4a4a;
            margin-bottom: 40px;
            line-height: 1.4;
            word-break: keep-all;
        }
 
        .answers {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
 
        .answer-btn {
            background: white;
            border: 2px solid #e1bee7;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.1em;
            cursor: pointer;
            text-align: left;
            color: #555;
            transition: all 0.2s;
            font-family: 'Gowun Dodum', sans-serif;
            line-height: 1.4;
        }
 
        .answer-btn:hover {
            border-color: var(--primary-color);
            background: #f8effd;
            transform: translateX(5px);
            color: var(--primary-color);
            font-weight: bold;
        }
 
        /* 결과 화면 스타일 */
        .report-header {
            display: flex;
            justify-content: space-between;
            background: #f3e5f5;
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 0.95em;
        }
        
        .report-header span {
            color: #6a1b9a;
            font-weight: bold;
        }
 
        .result-card {
            background: linear-gradient(135deg, #9796f0 0%, #fbc7d4 100%);
            color: #fff;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(151, 150, 240, 0.3);
            position: relative;
            overflow: hidden;
        }
 
        .result-card::before {
            content: '👑';
            font-size: 100px;
            position: absolute;
            top: -20px;
            right: -20px;
            opacity: 0.2;
            transform: rotate(15deg);
        }
 
        .result-type {
            font-family: 'Jua', sans-serif;
            font-size: 2.5em;
            margin: 10px 0;
            word-break: keep-all;
        }
 
        .section-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.3em;
            color: var(--secondary-color);
            margin: 30px 0 15px 0;
            border-bottom: 3px solid #f3e5f5;
            padding-bottom: 5px;
        }
 
        .section-content ul {
            list-style: none;
        }
 
        .section-content li {
            margin-bottom: 10px;
            padding-left: 24px;
            position: relative;
        }
 
        .section-content li::before {
            content: '✔️';
            position: absolute;
            left: 0;
            color: var(--accent-color);
        }
 
        .pill {
            display: inline-block;
            background: #fff;
            border: 2px solid #e1bee7;
            color: var(--secondary-color);
            padding: 8px 16px;
            border-radius: 25px;
            margin: 4px;
            font-size: 0.95em;
            font-weight: bold;
        }
 
        .advice-box {
            background: #fff8e1;
            border-left: 6px solid #ffca28;
            padding: 20px;
            border-radius: 10px;
            color: #5d4037;
            font-size: 1.1em;
            line-height: 1.6;
            font-style: italic;
        }
 
        @media (min-width: 600px) {
            .answers { grid-template-columns: 1fr 1fr; }
            .btn { width: auto; min-width: 200px; margin: 20px auto 0; display: block; }
        }
 
        @media print {
            .btn, .progress-container { display: none; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 시작 화면 -->
        <div id="startScreen" class="screen active">
            <h1>🦄 진로 드림<br>강점 분석</h1>
            <div class="subtitle">나는 어떤 특별한 힘을 가지고 있을까요?<br>재미있는 퀴즈로 나의 숨겨진 강점을 찾아보아요!</div>
            
            <div id="startError" style="display:none; color:#ff4081; text-align:center; margin-bottom:15px; font-weight:bold; background:#fce4ec; padding:10px; border-radius:10px;">
                ⚠️ 이름과 학년을 모두 입력해주세요!
            </div>
 
            <div class="input-group">
                <label>이름이 뭐예요?</label>
                <input type="text" id="userName" placeholder="이름을 입력해주세요" autocomplete="off">
            </div>
            <div class="input-group">
                <label>학년을 알려주세요</label>
                <select id="userGrade">
                    <option value="">학년 선택</option>
                    <option value="1학년">초등학교 1학년</option>
                    <option value="2학년">초등학교 2학년</option>
                    <option value="3학년">초등학교 3학년</option>
                    <option value="4학년">초등학교 4학년</option>
                    <option value="5학년">초등학교 5학년</option>
                    <option value="6학년">초등학교 6학년</option>
                </select>
            </div>
            <button class="btn" onclick="startQuiz()">검사 시작하기 🚀</button>
        </div>
 
        <!-- 퀴즈 화면 -->
        <div id="quizScreen" class="screen">
            <div class="progress-container">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="question-number" id="questionNumber">Question 1 / 20</div>
            <div class="question-text" id="questionText">질문이 여기에 나옵니다</div>
            <div class="answers" id="answersContainer"></div>
        </div>
 
        <!-- 결과 로딩 화면 -->
        <div id="loadingScreen" class="screen" style="justify-content: center; align-items: center; text-align: center;">
            <h2 style="color: var(--secondary-color); font-family: 'Jua'; font-size: 2em;">분석 중... 🔮</h2>
            <p>나의 강점을 찾고 있어요!</p>
        </div>
 
        <!-- 결과 화면 -->
        <div id="resultScreen" class="screen">
            <div class="report-header">
                <div>이름: <span id="resultName"></span></div>
                <div>학년: <span id="resultGrade"></span></div>
                <div>날짜: <span id="resultDate"></span></div>
            </div>
 
            <div class="result-card">
                <div style="font-size: 1em; opacity: 0.9; margin-bottom: 5px;">나의 강점 유형은?</div>
                <div class="result-type" id="resultType"></div>
                <div id="resultSubtitle" style="font-weight: bold; opacity: 0.95;"></div>
            </div>
 
            <div class="section-title">✨ 나의 특징</div>
            <div class="section-content"><ul id="strengthsList"></ul></div>
 
            <div class="section-title">🏫 추천 진로 & 과목</div>
            <div class="section-content"><ul id="careersList"></ul></div>
 
            <div class="section-title">💪 나의 특별한 능력</div>
            <div class="section-content" id="competencyTags"></div>
 
            <div class="section-title">💌 나에게 주는 조언</div>
            <div class="section-content advice-box" id="adviceContent"></div>
 
            <div style="display: flex; gap: 10px; margin-top: 30px; flex-direction: column;">
                <button class="btn" onclick="window.print()">결과 저장/인쇄하기 🖨️</button>
                <button class="btn" onclick="location.reload()" style="background: #e0e0e0; color: #555; box-shadow: none;">다시 하기 🔄</button>
            </div>
        </div>
    </div>
 
    <script>
        // 데이터 (10가지 유형)
        const resultData = {
            "창의적인 기획자": {
                subtitle: "새로운 아이디어가 퐁퐁! 🎨",
                strengths: ["남들과 똑같은 건 싫어하고, 새로운 걸 좋아해요.", "상상력이 풍부하고 나만의 방법으로 표현해요.", "엉뚱하지만 재미있는 생각이 많아요."],
                careers: ["디자이너, 웹툰 작가", "유튜버(크리에이터)", "광고 기획자", "추천 과목: 미술, 음악"],
                competencies: ["창의적 사고", "미적 감각", "아이디어"],
                advice: "\"세상을 너만의 색깔로 칠해봐. 너의 상상력이 가장 큰 무기야!\""
            },
            "탐구하는 분석가": {
                subtitle: "궁금한 건 못 참아! 🔍",
                strengths: ["'왜?'라는 질문을 자주 하고 깊이 생각해요.", "관찰하고 실험하는 것을 좋아해요.", "논리적으로 따져보는 걸 잘해요."],
                careers: ["과학자, 의사", "프로그래머(개발자)", "프로파일러", "추천 과목: 수학, 과학"],
                competencies: ["비판적 사고", "문제 해결", "분석력"],
                advice: "\"궁금한 것을 끝까지 파헤쳐봐. 지식이 너의 길을 밝혀줄 거야.\""
            },
            "공감하는 조력자": {
                subtitle: "따뜻한 마음의 천사 👼",
                strengths: ["친구의 마음을 잘 이해하고 위로해줘요.", "도와주는 것에서 기쁨을 느껴요.", "싸움을 말리고 화해시키는 평화주의자예요."],
                careers: ["선생님, 심리상담가", "의사/간호사", "사회복지사", "추천 과목: 도덕, 국어"],
                competencies: ["공감 능력", "배려심", "소통"],
                advice: "\"너의 따뜻한 마음은 친구들을 행복하게 해. 지금처럼 상냥한 마음을 간직해줘.\""
            },
            "주도적인 실행가": {
                subtitle: "멋진 리더 대장 🚩",
                strengths: ["목표를 정하면 바로 행동으로 옮겨요.", "친구들을 이끌고 분위기를 주도해요.", "어려운 일도 씩씩하게 도전해요."],
                careers: ["CEO(사장님)", "정치인, 변호사", "방송 PD", "추천 과목: 사회, 체육"],
                competencies: ["리더십", "추진력", "자신감"],
                advice: "\"네가 가는 길이 곧 새로운 길이야. 세상을 이끄는 너의 힘을 믿어!\""
            },
            "실천적인 제작자": {
                subtitle: "금손 뚝딱이 🛠️",
                strengths: ["말보다 직접 해보는 게 좋아요.", "손으로 만들거나 몸 쓰는 걸 잘해요.", "고장 난 물건을 뚝딱 고쳐요."],
                careers: ["로봇 공학자", "요리사, 제과제빵사", "운동선수, 건축가", "추천 과목: 실과, 체육"],
                competencies: ["도구 활용", "신체 능력", "손재주"],
                advice: "\"생각을 현실로 만드는 너의 손과 발을 믿어. 너는 무엇이든 만들 수 있어.\""
            },
            "꼼꼼한 관리자": {
                subtitle: "완벽한 계획왕 📝",
                strengths: ["작은 것도 놓치지 않고 꼼꼼해요.", "계획을 세워서 차근차근 실천해요.", "규칙과 약속을 아주 잘 지켜요."],
                careers: ["회계사, 은행원", "데이터 분석가", "약사, 공무원", "추천 과목: 수학, 사회"],
                competencies: ["정확성", "계획성", "성실함"],
                advice: "\"작은 차이가 큰 변화를 만들어. 너의 꼼꼼함이 세상을 더 완벽하게 할 거야.\""
            },
            "표현하는 전달자": {
                subtitle: "말하기 글쓰기 대장 🎤",
                strengths: ["내 생각을 말이나 글로 재미있게 표현해요.", "사람들 앞에서 이야기하는 걸 즐겨요.", "설득력이 있고 유머 감각이 있어요."],
                careers: ["아나운서, 기자", "배우, 가수", "작가", "추천 과목: 국어, 영어"],
                competencies: ["발표력", "전달력", "친화력"],
                advice: "\"너의 목소리와 글로 세상을 감동시켜봐. 너의 표현이 곧 멋진 메시지야.\""
            },
            "도전하는 개척가": {
                subtitle: "용감한 모험가 🚀",
                strengths: ["새로운 일에 도전하는 게 신나요.", "실패를 두려워하지 않고 다시 일어나요.", "경쟁하고 이기는 것을 좋아해요."],
                careers: ["창업가(스타트업)", "스포츠 선수", "여행가, 소방관", "추천 과목: 체육, 사회"],
                competencies: ["도전 정신", "위기 대처", "용기"],
                advice: "\"넘어져도 괜찮아! 다시 일어서면 돼. 너의 용기가 널 크게 성장시킬 거야.\""
            },
            "조화로운 중재자": {
                subtitle: "평화 지킴이 🕊️",
                strengths: ["모두가 사이좋게 지내는 게 중요해요.", "여러 의견을 잘 듣고 조율해요.", "적을 만들지 않고 두루두루 친해요."],
                careers: ["외교관", "매니저", "인사 담당자", "추천 과목: 사회, 외국어"],
                competencies: ["협동심", "갈등 해결", "유연성"],
                advice: "\"너와 내가 '우리'가 되게 하는 힘, 그게 바로 너야. 평화로운 세상을 만들어 줘.\""
            },
            "융합하는 혁신가": {
                subtitle: "똑똑한 발명가 💡",
                strengths: ["여러 분야에 호기심이 많아요.", "서로 다른 걸 섞어서 새롭게 만들어요.", "새로운 기술을 배우는 게 빨라요."],
                careers: ["AI 전문가", "발명가", "문화 기획자", "추천 과목: 과학, 코딩"],
                competencies: ["융합 사고", "응용력", "학습 능력"],
                advice: "\"세상의 모든 지식이 너의 재료야. 경계를 넘어 새로운 걸 만들어봐!\""
            }
        };
 
        // 질문 및 선택지 데이터 (30문항 × 4지선다)
        // - 10개 유형이 각각 12번씩 등장하고, 서로 다른 두 유형이 한 문항에서 만나는 횟수도 모든 짝이 똑같이 4번이 되도록 설계
        //   (어느 유형도 유리하거나 불리하지 않게 고르게 비교됨)
        // - 선택지는 결과 화면 '나의 특징' 문장에 맞춰 작성
        const quizData = [
            { q: "미술 시간에 자유 주제로 작품을 만들 때 나는?", a: [

                {t: "날짜별로 할 일을 정해 계획표를 꼼꼼히 만든다", type: "꼼꼼한 관리자"},
                {t: "여러 분야를 골고루 배워 보는 계획을 세운다", type: "융합하는 혁신가"}
            ]},
            { q: "가족 여행을 다녀온 뒤 나는?", a: [
                {t: "여행 이야기를 친구들에게 실감 나게 들려준다", type: "표현하는 전달자"},
                {t: "가족 모두 즐거웠는지 함께 이야기 나누는 시간을 만든다", type: "조화로운 중재자"},
                {t: "주워 온 돌이나 사진으로 기념품을 직접 만든다", type: "실천적인 제작자"},
                {t: "여행지에서 본 신기한 것을 더 찾아보고 조사한다", type: "탐구하는 분석가"}
            ]},
            { q: "쉬는 시간에 나는 주로...", a: [
                {t: "여러 친구가 다 같이 할 수 있는 놀이를 제안한다", type: "조화로운 중재자"},
                {t: "새로 나온 기계나 앱 같은 신기한 기술을 찾아본다", type: "융합하는 혁신가"},
                {t: "종이접기나 만들기처럼 손으로 하는 놀이를 한다", type: "실천적인 제작자"},
                {t: "혼자 있는 친구에게 다가가 말을 건다", type: "공감하는 조력자"}
            ]}
        ];
 
        // 변수 설정
        let currentQ = 0;
        let scores = {};
 
        // 화면 전환 함수 (부드럽게)
        function switchScreen(fromId, toId) {
            const fromScreen = document.getElementById(fromId);
            const toScreen = document.getElementById(toId);
            
            fromScreen.style.opacity = 0;
            setTimeout(() => {
                fromScreen.classList.remove('active');
                toScreen.classList.add('active');
                // 리플로우 강제 실행 (애니메이션 재시작을 위해)
                void toScreen.offsetWidth; 
                toScreen.style.opacity = 1;
            }, 300);
        }
 
        // 검사 시작
        function startQuiz() {
            const name = document.getElementById('userName').value;
            const grade = document.getElementById('userGrade').value;
            
            if(!name.trim() || !grade) {
                document.getElementById('startError').style.display = 'block';
                // 흔들리는 애니메이션 효과
                const btn = document.querySelector('#startScreen .btn');
                btn.style.transform = 'translateX(10px)';
                setTimeout(() => btn.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => btn.style.transform = 'translateX(0)', 200);
                return;
            }
            
            // 점수 초기화
            for(let key in resultData) scores[key] = 0;
            
            switchScreen('startScreen', 'quizScreen');
            showQuestion();
        }
 
        // 질문 보여주기
        function showQuestion() {
            const q = quizData[currentQ];
            
            // 진행바 업데이트
            const progress = ((currentQ) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            // 페이드 효과를 위해 텍스트 투명도 조절
            const qText = document.getElementById('questionText');
            const aContainer = document.getElementById('answersContainer');
            
            // 데이터 매핑 (q.q, ans.t 사용)
            document.getElementById('questionNumber').innerText = `Question ${currentQ + 1} / ${quizData.length}`;
            qText.innerText = q.q;
            
            aContainer.innerHTML = '';
            
            q.a.forEach((ans, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerText = ans.t;
                
                // 버튼 등장 애니메이션 (순차적으로)
                btn.style.opacity = 0;
                btn.style.transform = 'translateY(20px)';
                
                btn.onclick = () => {
                    // 선택 효과
                    btn.style.background = '#9b59b6';
                    btn.style.color = 'white';
                    setTimeout(() => selectAnswer(ans.type), 200);
                };
                
                aContainer.appendChild(btn);
                
                // 순차적 등장
                setTimeout(() => {
                    btn.style.transition = 'all 0.5s ease';
                    btn.style.opacity = 1;
                    btn.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }
 
        // 답변 선택 처리
        function selectAnswer(type) {
            scores[type]++;
            
            if(currentQ < quizData.length - 1) {
                currentQ++;
                showQuestion();
            } else {
                // 진행바 100%
                document.getElementById('progressFill').style.width = '100%';
                finishQuiz();
            }
        }
 
        // 퀴즈 종료 및 결과 처리
        function finishQuiz() {
            switchScreen('quizScreen', 'loadingScreen');
            
            // 로딩 효과 (2초 후 결과 보여줌)
            setTimeout(() => {
                showResult();
                switchScreen('loadingScreen', 'resultScreen');
            }, 2000);
        }
 
        // 결과 보여주기
        function showResult() {
            // 최고 점수 유형 찾기
            let max = -1;
            let type = '';
            for(let key in scores) {
                if(scores[key] > max) {
                    max = scores[key];
                }
            }
            // 동점자 처리: 최고 점수가 같은 유형이 여러 개면 그중 하나를 무작위로 선택
            // (목록 앞쪽 유형만 결과로 나오는 쏠림 방지)
            const topTypes = Object.keys(scores).filter(key => scores[key] === max);
            type = topTypes[Math.floor(Math.random() * topTypes.length)];
 
            const info = resultData[type];
            const name = document.getElementById('userName').value;
            const grade = document.getElementById('userGrade').value;
            const date = new Date().toLocaleDateString();
 
            // 기본 정보 입력
            document.getElementById('resultName').innerText = name;
            document.getElementById('resultGrade').innerText = grade;
            document.getElementById('resultDate').innerText = date;
            
            // 결과 내용 입력
            document.getElementById('resultType').innerText = type;
            document.getElementById('resultSubtitle').innerText = info.subtitle;
 
            // 리스트 채우기 함수
            const fillList = (id, arr) => {
                const el = document.getElementById(id);
                el.innerHTML = '';
                arr.forEach((txt, idx) => {
                    const li = document.createElement('li');
                    li.innerText = txt;
                    // 리스트 아이템 순차 등장
                    li.style.opacity = 0;
                    li.style.transform = 'translateX(-10px)';
                    li.style.transition = `all 0.5s ease ${idx * 0.1}s`;
                    el.appendChild(li);
                    
                    setTimeout(() => {
                        li.style.opacity = 1;
                        li.style.transform = 'translateX(0)';
                    }, 100);
                });
            };
 
            fillList('strengthsList', info.strengths);
            fillList('careersList', info.careers);
            
            // 태그 채우기
            const tagsEl = document.getElementById('competencyTags');
            tagsEl.innerHTML = '';
            info.competencies.forEach(txt => {
                const span = document.createElement('span');
                span.className = 'pill';
                span.innerText = `#${txt}`;
                tagsEl.appendChild(span);
            });
 
            document.getElementById('adviceContent').innerText = info.advice;
        }
    </script>
</body>
